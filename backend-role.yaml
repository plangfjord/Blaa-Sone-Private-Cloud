apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-networkpolicy-reader
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-networkpolicy-reader
subjects:
  - kind: ServiceAccount
    name: default
roleRef:
  kind: Role
  name: backend-networkpolicy-reader
  apiGroup: rbac.authorization.k8s.io